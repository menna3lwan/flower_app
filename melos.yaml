name: flowery_workspace

packages:
  - apps/*
  - packages/*

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  analyze:
    description: Run `flutter analyze` in every package/app.
    run: melos exec -- flutter analyze
    exec:
      concurrency: 1

  test:
    description: Run `flutter test` in every package/app that has a test/ directory.
    run: melos exec --dir-exists=test -- flutter test
    exec:
      concurrency: 1

  format:
    description: Check formatting across the whole workspace.
    run: melos exec -- dart format --set-exit-if-changed .
    exec:
      concurrency: 1

  clean:
    description: Remove build artifacts from every package/app.
    run: melos exec -- flutter clean
    exec:
      concurrency: 1
