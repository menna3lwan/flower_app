name: core
description: >
  Application-agnostic technical infrastructure shared by every Flowery app:
  network client contract, error/result types, local storage contract, base
  Cubit, and the single GetIt service-locator instance. Contains no UI and
  no feature/business logic — see the `common` package for shared widgets
  and `shared` for shared domain models.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
