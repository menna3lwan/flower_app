name: design_system
description: >
  Flowery's shared visual language, extracted from the Figma design file:
  brand colors, typography, spacing/dimension tokens, and the Material
  ThemeData built from them, plus the shared brand-asset path registry
  (logo/brand icon). Both the customer and rider apps depend on this
  package so they render with one consistent brand — never a feature or
  an application.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # `assets/fonts/` also ships IMFellEnglish.ttf, Outfit.ttf and roboto.ttf
  # (synced from `development` as-is) — only Inter is registered as a font
  # family here because that's the only one `development` itself declares;
  # the others are currently unused there too. The active theme typeface
  # (Poppins, via `google_fonts` in `theme/app_text_styles.dart`) is
  # unrelated and unchanged by this asset sync.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
