name: common
description: >
  Reusable, app-agnostic UI components — buttons, inputs, dialogs, and
  loading/error/empty state widgets. Depends only on Flutter and
  `design_system` for its visual tokens; never on a feature or an
  application, and never bakes in app-specific copy (labels are passed in
  by the caller).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  design_system:
    path: ../design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
