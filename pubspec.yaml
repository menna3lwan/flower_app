name: flower_app
description: "Flower App — a Clean Architecture + MVI (Cubit) Flutter skeleton built from the Flower App Figma design."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Cubit/Bloc, presentation layer only)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency injection
  get_it: ^7.7.0

  # Navigation / utilities
  get: ^4.6.6

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/illustrations/
    - assets/translations/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
