name: customer_app
description: "Flowery — the E-commerce/Customer Flutter app (browse, cart, checkout, order tracking, profile)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management (Cubit/Bloc, presentation layer only — see core/base/base_cubit.dart).
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency injection (core/di/injector.dart is the single GetIt instance).
  get_it: ^7.7.0

  # Navigation / utilities only — never state management (see core/routing/).
  get: ^4.6.6

  # Design system typography (see core/theme/app_text_styles.dart).
  google_fonts: ^6.2.1

  # Localization (English + Arabic, LTR/RTL). Reads assets/translations/*.json
  # (see AppAssets.translationsPath); AppStrings' getters call `.tr()`.
  easy_localization: ^3.0.7

  cupertino_icons: ^1.0.8

  # HTTP client backing core/network/api_client.dart's DioApiClient — added
  # once the Team2DockerProdution backend (API Gateway + Auth service) gave
  # us a real base URL to call. See docs/BACKEND_INTEGRATION_TODO.md.
  dio: ^5.7.0

  # Secure, encrypted persistence for the JWT access token (core/storage/
  # secure_storage_service.dart) — deliberately separate from
  # LocalStorageService, which is not encrypted and was never meant to
  # hold real credentials.
  flutter_secure_storage: ^9.2.2

  # Real connectivity check for core/network/network_info.dart, replacing
  # the always-online placeholder now that there is a remote call to gate.
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
