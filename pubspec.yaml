name: customer_app
description: "Flowery — the E-commerce/Customer Flutter app (browse, cart, checkout, order tracking, profile)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management (Cubit/Bloc, presentation layer only — see core/base/base_cubit.dart).
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency injection (core/di/injector.dart is the single GetIt instance).
  get_it: ^7.7.0

  # Generates the app-wide GetIt registrations from @injectable/
  # @LazySingleton/@module annotations across features/** (see
  # core/di/injectable_injector.dart's single configureDependencies()) —
  # no feature hand-registers its own dependencies in a per-feature
  # injector file anymore.
  injectable: ^2.5.0

  # Navigation / utilities only — never state management (see core/routing/).
  get: ^4.6.6

  # Design system typography (see core/theme/app_text_styles.dart).
  google_fonts: ^6.2.1

  # Localization (English + Arabic, LTR/RTL). Reads assets/translations/*.json
  # (see AppAssets.translationsPath); AppStrings' getters call `.tr()`.
  easy_localization: ^3.0.7

  cupertino_icons: ^1.0.8

  # HTTP client backing core/network/api_client.dart's DioApiClient — added
  # once the Team2DockerProdution backend (API Gateway + Auth service) gave
  # us a real base URL to call. See docs/BACKEND_INTEGRATION_TODO.md.
  dio: ^5.7.0

  # Typed HTTP client generation for the Auth module's API surface
  # (features/auth/api/auth_api_service.dart) — Retrofit sits on top of
  # the same Dio instance core/network/dio_client_factory.dart builds, so
  # interceptors (auth header, Accept-Language, logging) still apply.
  retrofit: ^4.4.1

  # Secure, encrypted persistence for the JWT access token (core/storage/
  # secure_storage_service.dart) — deliberately separate from
  # LocalStorageService, which is not encrypted and was never meant to
  # hold real credentials.
  flutter_secure_storage: ^9.2.2

  # Real connectivity check for core/network/network_info.dart, replacing
  # the always-online placeholder now that there is a remote call to gate.
  connectivity_plus: ^6.1.0

  # OTP/verification-code input (see otp_verification_view.dart) — a
  # focused, actively maintained widget for exactly this one input
  # pattern (per-digit boxes, auto-focus, filled/error/disabled states),
  # instead of hand-rolling and re-testing that state machine ourselves.
  pinput: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation for injectable (DI registrations) and retrofit (API
  # client bodies). Run `dart run build_runner build
  # --delete-conflicting-outputs` after any change to an @injectable,
  # @module, or @RestApi-annotated file — see the header comment on
  # core/di/injectable_injector.config.dart and
  # features/auth/api/auth_api_service.g.dart for why those two files are
  # checked in as hand-written stand-ins rather than build_runner output.
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  retrofit_generator: ^9.1.5

  # Unit-test mocking for AuthApiService/AuthRepository/AuthRemoteDataSource
  # (test/support/mocks.dart) — manual `extends Mock implements X` mocks,
  # deliberately not the `@GenerateMocks`-annotated codegen flavor, so the
  # test suite doesn't also depend on a build_runner run to exist.
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
