name: flowery_workspace
description: >
  Monorepo workspace root for the Flowery apps — NOT a buildable Flutter
  app itself (no `lib/`). Real code lives in `apps/customer_app`,
  `apps/rider_app`, and `packages/*`; this manifest only exists to hold
  the dev-tooling dependency (Melos) used to bootstrap/analyze/test the
  whole workspace. See `melos.yaml` and `README.md`.
publish_to: 'none'

environment:
  sdk: ^3.5.0

dev_dependencies:
  # melos.yaml's `scripts` use the >= 8.0.0 schema (command nested inside
  # `exec`, not split across `run`/`exec`) — keep this constraint on the
  # 8.x line so `dart run melos` resolves a version that understands it.
  melos: ^8.2.2
