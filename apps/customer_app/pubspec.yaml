name: customer_app
description: "Flowery — the customer/e-commerce Flutter app (browse, cart, checkout, order tracking, profile)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Shared workspace packages.
  core:
    path: ../../packages/core
  common:
    path: ../../packages/common
  design_system:
    path: ../../packages/design_system
  shared:
    path: ../../packages/shared

  # State management (Cubit/Bloc, presentation layer only)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation / utilities (routing/utilities only — never state management)
  get: ^4.6.6

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
    - assets/animations/
